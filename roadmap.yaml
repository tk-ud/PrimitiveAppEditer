roadmap:
  name: "App Editor"
  specification_sources:
    - source: "./App Editer.md"
      authority: "Architecture / Authority / Boundary SSOT"
    - source: "./Editor UI.md"
      authority: "Interaction / Placement / Editing Regulation SSOT"
    - source: "./Function Graph.md"
      authority: "Function Graph interaction / dependency authoring SSOT"
    - source: "./Resolver.md"
      authority: "Request resolve / operation dispatch SSOT"
  status_values:
    - "not started"
    - "partial"
    - "implemented"

  loop:
    selection:
      - "Read this roadmap before each implementation cycle."
      - "Select the first bundle whose status is not 'implemented' and whose depends_on bundles are all 'implemented'."
      - "If the selected bundle already has partial implementation, inspect the existing implementation before changing it."
    execution:
      - "Implement the selected bundle as one coherent unit."
      - "Do not silently expand scope beyond the selected bundle and its required integration fixes."
      - "Preserve the Authority and Boundary Rules defined by the reference document."
    verification:
      - "Run the smallest sufficient build/tests/validation for the selected bundle."
      - "Compare implementation behavior against every reference section listed by the bundle."
    update:
      - "Set status to 'implemented' only when the bundle contract is fully satisfied and verification passes."
      - "Set status to 'partial' when useful implementation exists but the bundle contract is incomplete or verification fails."
      - "Leave status as 'not started' when no implementation was produced."
      - "Record evidence and remaining work before starting the next cycle."
      - "Re-read this roadmap and repeat."
    stop_conditions:
      - "All bundles are 'implemented'."
      - "A reference conflict prevents a deterministic implementation decision."
      - "A destructive or authority-violating change would be required."
      - "Required dependency cannot be implemented within the current repository scope."

  invariants:
    - "Registry is the authority for application physical schema."
    - "Physical schema is a projection and must never be used to reverse-generate Registry authority."
    - "Registry mutation is executed by the C# Registry Service; SQLite triggers are not schema authority."
    - "Relation authority is logical relation_registry; physical foreign keys are not relation authority."
    - "UUID is machine identity; name/label are human display identifiers."
    - "Runtime execution uses resolved in-memory state and must not query SQLite per frame."
    - "Function output and frame state are transient unless explicitly persisted."
    - "Renderer is projection, not application authority."
    - "Working Directory plus project.sqlite is authoring authority."
    - "Build output is derived and must not mutate authoring authority."
    - "Workbench UI is not application authority."

