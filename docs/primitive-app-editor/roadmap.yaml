          - "§3 Open: openProjectDirectory(IFileService, root, steps) runs Working Directory Select -> Directory Scan (write-free scanProjectDirectory; non-directory root or wrong entry kind -> ProjectDirectoryError) -> project.sqlite exists? Create : Open -> Editor DDL Scan -> Schema Version Resolve -> Migration Apply -> Registry Load -> Function Scan || Asset Scan (parallel) -> Editor Ready. Each step after Directory Scan is owned by its service through the IProjectOpenSteps extension point (createStorage / openStorage own project.sqlite). Asserts Working Directory is the Project Storage authority (foundation.authority runtimeAuthority)."
          - "Editor Ready contract (commit 44d5ba41, PR #19 audit fix): getRequiredOpenPhases(mode) = [Create | Open, Editor DDL Scan, Schema Version Resolve, Migration Apply, Registry Load, Function Scan, Asset Scan]. If any required step is not supplied, the result is ProjectOpenStatus.Incomplete with missingPhases; the open stops after Directory Scan without creating directories, without running any step, and never records editorReady. Only when every required step actually completed is the result ProjectOpenStatus.Ready with phases ending in editorReady. Missing layout directories are created only for a complete open and never overwrite or delete existing content. A failing step rejects the open before Editor Ready. This replaces the earlier skippedPhases behaviour that reached Editor Ready without project.sqlite creation or Registry Load."
          - "§32 Persistence Boundary: common/persistenceBoundary.ts with Authoring Persistent paths (project.sqlite, functions, assets, scripts, config; build/ excluded), Runtime Transient artifacts equal to the authority Transient Runtime lifecycle, persistenceRule (Authoring Save = Working Directory + SQLite, Runtime State = Memory, explicit only, every frame prohibited) and checkPersistence / assertPersistence (PersistenceBoundaryError for every-frame or non-explicit runtime persistence). Runtime Save Data contract registry.current {uuid, saveId -> logs.savedata.uuid, key, data json; UNIQUE key; UPSERT conflict target = key only} and logs.savedata {uuid, timestamptz} as Save Event only; createSaveEvent and upsertSaveDataCurrent (keeps uuid, updates saveId/data on the same key, Application-defined key/payload, no Core key taxonomy, no automatic static data duplication)."
