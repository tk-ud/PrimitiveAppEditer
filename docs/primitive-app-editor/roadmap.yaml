              - "§11 Execution Result"
              - "§12 Roadmap Diagnostics"
              - "§13 Run Artifacts"
              - "§14 Boundary"
              - "§15 Implementation Bundle"
              - "§16 Open Issues"
          - source: "./Editor UI.md"
            role: "implementation"
