roadmap:
  name: "App Editor"
  specification_sources:
    - source: "./App Editer.md"
      authority: "Architecture / Authority / Boundary SSOT"
    - source: "./Editor UI.md"
      authority: "Interaction / Placement / Editing Regulation SSOT"
    - source: "./Function Graph.md"
      authority: "Function Graph interaction / dependency authoring SSOT"
    - source: "./Resolver.md"
      authority: "Request resolve / operation dispatch SSOT"
    - source: "./Agent tool.md"
      authority: "roadmap Agent Tool specification SSOT"
    - source: "./GUI Debug Tool.md"
      authority: "Roadmap Driven GUI Debug Tool specification / roadmap diagnostics write contract SSOT"
    - source: "./Deploy Configuration.md"
      authority: "Deploy Template / Selection / Docker Projection / Deploy Validation / Deploy E2E SSOT"
    - source: "../../README.md"
      authority: "Repository / Upstream / Development Baseline"
  status_values:
    - "not started"
    - "partial"
    - "implemented"

  loop:
    selection:
      - "Read this roadmap before each implementation cycle."
      - "Select the first bundle whose status is not 'implemented' and whose depends_on bundles are all 'implemented'."
      - "If the selected bundle already has partial implementation, inspect the existing implementation before changing it."
    execution:
      - "Implement the selected bundle as one coherent unit."
      - "Do not silently expand scope beyond the selected bundle and its required integration fixes."
      - "Preserve the Authority and Boundary Rules defined by the reference document."
    verification:
      - "Run the smallest sufficient build/tests/validation for the selected bundle."
      - "Compare implementation behavior against every reference section listed by the bundle."
      - "Bundle verification is unit / integration / contract tests, CI and evidence. GUI Debug Tool Checkpoint execution and GUI observation of a running Workbench are not bundle verification (../../README.md GUI Verification Cycle)."
    update:
      - "Set status to 'implemented' only when the bundle contract is fully satisfied and verification passes."
      - "Set status to 'partial' when useful implementation exists but the bundle contract is incomplete or verification fails."
      - "Leave status as 'not started' when no implementation was produced."
      - "Record evidence and remaining work before starting the next cycle."
      - "Re-read this roadmap and repeat."
    stop_conditions:
      - "All bundles are 'implemented'."
      - "A reference conflict prevents a deterministic implementation decision."
      - "A destructive or authority-violating change would be required."
      - "Required dependency cannot be implemented within the current repository scope."
    gui_verification:
      - "The UI Map (GUI Map) is designed before the corresponding roadmap bundles are created; GUI verification runs after this loop completes (roadmap.next = completed) and is not a stop condition or a completion condition of any bundle (../../README.md GUI Verification Cycle)."
      - "GUI verification results are generated as records in diagnostics.gui_debug by the GUI Debug Tool; record state / resolution.bundle_ids change only by an Owner-approved design_change (./GUI Debug Tool.md §12 Roadmap Diagnostics / State)."
      - "A fix derived from GUI verification or human quality test results is added to this roadmap as a bundle only by an Owner decision through design_change; it then re-enters this loop and GUI verification / human quality test are repeated as needed."
      - "depends_on expresses implementation dependency only; GUI Map Checkpoint conditions are never used as depends_on."

  invariants:
    - "Registry is the authority for application physical schema."
    - "Physical schema is a projection and must never be used to reverse-generate Registry authority."
    - "Registry mutation is executed by the App Editor Registry Service; SQLite triggers are not schema authority."
    - "Relation authority is logical relation_registry; physical foreign keys are not relation authority."
    - "UUID is machine identity; name/label are human display identifiers."
    - "Runtime execution uses resolved in-memory state and must not query SQLite per frame."
    - "Function output and frame state are transient unless explicitly persisted."
    - "Renderer is projection, not application authority."
    - "Working Directory plus project.sqlite is authoring authority."
    - "Build output is derived and must not mutate authoring authority."
    - "Workbench UI is not application authority."

section:
  - name: "Tooling"
    bundle:
      - id: "tooling.roadmap-agent"
        title: "roadmap Agent Tool (roadmap.next / roadmap.complete)"
        reference:
          - source: "./Agent tool.md"
            role: "implementation"
            sections:
              - "roadmap Tool"
          - source: "../../README.md"
            role: "boundary"
            sections:
              - "Tool First"
        depends_on: []
        status: "implemented"
        evidence:
          - "Implementation commit ae47e50c: standalone stdio MCP server tools/primitive-app-editor/roadmap-mcp (src/roadmap.ts, src/markdown.ts, src/next.ts, src/complete.ts, src/server.ts, src/stdio.ts), isolated from src/vs (Code OSS) and test/mcp, registered in .mcp.json as primitive-app-editor-roadmap (npm --prefix tools/primitive-app-editor/roadmap-mcp run --silent start-stdio)."
          - "roadmap.next: read_yaml, collect_candidates (status != implemented), resolve_dependencies (all depends_on implemented), select_first (section order, bundle order), read_markdown_sections for selected_bundle.reference only (§N Title, §N Sub, §N Title / Sub, plain Title; fenced code ignored), implementation / boundary separation with source and role preserved, detect_reference_conflict (same heading referenced as implementation and boundary -> blocked), render_prompt with the Agent tool.md template; no_candidate -> completed, blocked -> blocked."
          - "roadmap.complete: strict input {id, status, evidence, remaining}; validation rules bundle_exists, current_status_is_not_implemented, depends_on_unchanged, dependencies_are_implemented, evidence_not_empty, implemented_requires_empty_remaining, partial_requires_non_empty_remaining, status_transition; updates only the target bundle status / evidence / remaining text, re-parses to verify all other roadmap content is unchanged, atomic temp-file + rename write; returns next_action restart / completed / blocked."
          - "Verification: cd tools/primitive-app-editor/roadmap-mcp && npm ci && npm test -> 16 tests / 4 suites pass (bundle selection, dependency gating, reference section extraction, implementation / boundary separation, no candidate / blocked / reference conflict, complete validation, not started -> partial -> partial -> implemented and partial -> implemented transitions, unrelated roadmap text byte-identical, prompt template equals Agent tool.md, stdio MCP end-to-end)."
          - "Real roadmap reference sweep (src/test/markdown.test.ts): all App Editer.md, Resolver.md, Function Graph.md, README.md and Agent tool.md section references resolve (e.g. §3 Open, §22 Function Runtime / Load, §23 Runtime Addressing / Editor, §30 Function / Program Scan); Editor UI.md references whose number and title disagree are rejected instead of guessed."
          - "Tool First bootstrap: roadmap.next via the .mcp.json server selected tooling.roadmap-agent (./Agent tool.md implementation, ../../README.md boundary), and this completion was recorded by roadmap.complete through the same MCP server."
          - "No earlier producer bundle required an integration fix."
        remaining: []

