        status: "implemented"
        evidence:
          - "Implementation commits 3d5f2a04 + 44d5ba41: src/vs/workbench/contrib/primitiveAppEditor/common/projectDirectory.ts encodes §3 Project Working Directory: canonical <Project>/ layout (project.sqlite, functions/, assets/{image,audio,font,shader,other}, scripts/, config/, build/) with roles Structured Data = project.sqlite, Program = functions/ + scripts/, Binary Asset = assets/, Output = build/ (no authority artifact), Config = config/, each linked to the foundation.authority Artifact; resolveProjectPaths for every layout entry."
          - "§3 Open: openProjectDirectory(IFileService, root, steps) runs Working Directory Select -> Directory Scan (write-free scanProjectDirectory; non-directory root or wrong entry kind -> ProjectDirectoryError) -> project.sqlite exists? Create : Open -> Editor DDL Scan -> Schema Version Resolve -> Migration Apply -> Registry Load -> Function Scan || Asset Scan (parallel) -> Editor Ready. Each step after Directory Scan is owned by its service through the IProjectOpenSteps extension point (createStorage / openStorage own project.sqlite). Asserts Working Directory is the Project Storage authority (foundation.authority runtimeAuthority)."
          - "Editor Ready contract (commit 44d5ba41, PR #19 audit fix): getRequiredOpenPhases(mode) = [Create | Open, Editor DDL Scan, Schema Version Resolve, Migration Apply, Registry Load, Function Scan, Asset Scan]. If any required step is not supplied, the result is ProjectOpenStatus.Incomplete with missingPhases; the open stops after Directory Scan without creating directories, without running any step, and never records editorReady. Only when every required step actually completed is the result ProjectOpenStatus.Ready with phases ending in editorReady. Missing layout directories are created only for a complete open and never overwrite or delete existing content. A failing step rejects the open before Editor Ready. This replaces the earlier skippedPhases behaviour that reached Editor Ready without project.sqlite creation or Registry Load."
          - "§32 Persistence Boundary: common/persistenceBoundary.ts with Authoring Persistent paths (project.sqlite, functions, assets, scripts, config; build/ excluded), Runtime Transient artifacts equal to the authority Transient Runtime lifecycle, persistenceRule (Authoring Save = Working Directory + SQLite, Runtime State = Memory, explicit only, every frame prohibited) and checkPersistence / assertPersistence (PersistenceBoundaryError for every-frame or non-explicit runtime persistence). Runtime Save Data contract registry.current {uuid, saveId -> logs.savedata.uuid, key, data json; UNIQUE key; UPSERT conflict target = key only} and logs.savedata {uuid, timestamptz} as Save Event only; createSaveEvent and upsertSaveDataCurrent (keeps uuid, updates saveId/data on the same key, Application-defined key/payload, no Core key taxonomy, no automatic static data duplication)."
          - "Tests: test/common/projectDirectory.test.ts (12 tests: layout, roles, paths; full-step Create and Open both Ready with the exact phase order ending in editorReady; Open repairing missing directories without creating project.sqlite; no steps -> Incomplete with all required phases missing, root not created; each single missing required step (createStorage, editorDdlScan, schemaVersionResolve, migrationApply, registryLoad, functionScan, assetScan) -> Incomplete with exactly that phase missing, no step run, no project.sqlite; storage step required follows the mode (Create needs createStorage, Open needs openStorage); write-free Directory Scan; wrong entry kinds rejected; failing step stops before Editor Ready) and test/common/persistenceBoundary.test.ts (5 tests incl. the player.hp Save-A -> Save-B UPSERT example), using FileService + InMemoryFileSystemProvider."
          - "Verification: npm run transpile-client + mocha node unit runner on **/primitiveAppEditor/test/**/*.test.js -> 34 passing (16 authority + 18 bundle tests); eslint --max-warnings 0 on src/vs/workbench/contrib/primitiveAppEditor clean; tsc -p src/tsconfig.json --noEmit reports 0 errors in primitiveAppEditor (remaining errors are only missing electron typings from npm ci --ignore-scripts); build/checker/layersChecker.ts passes; build/hygiene.ts on the changed files passes. PR #19 CI on 3d11ef8b (pre-fix head) was green on all 13 checks."
          - "Physical registry.current / logs.savedata table creation and the concrete Create/Open storage, Editor DDL, migration, Registry, Function and Asset step implementations are owned by later bundles (foundation.sqlite, foundation.editor-ddl, registry.*, function.program-scan, asset.registry), which plug into IProjectOpenSteps; until they are supplied the open is Incomplete, never Editor Ready. No earlier producer bundle required an integration fix: foundation.authority Artifact / ArtifactLifecycle / runtimeAuthority were consumed unchanged."
        remaining: []

      - id: "foundation.sqlite"
        title: "project.sqlite authoring storage"
        reference:
          - source: "./App Editer.md"
            role: "implementation"
            sections:
              - "§4 SQLite"
              - "§4 Logical Namespace"
              - "§32 Save / Load Operation"
              - "§32 Transaction / Integrity"
          - source: "./App Editer.md"
            role: "boundary"
            sections:
              - "§32 Rule"
              - "§32 Runtime Save Data"
              - "§32 Save Identity"
              - "§32 Application Responsibility"
              - "§32 Save Payload"
              - "§32 Static / Initial Data Boundary"
        depends_on:
          - "foundation.project-directory"
        status: "implemented"
        evidence:
          - "Implementation commits 01f97bff + 89ddeab3: src/vs/workbench/contrib/primitiveAppEditor/common/projectSqlite.ts encodes §4 SQLite: projectSqliteContents in spec order (Editor Internal Schema, Registry, Physical Tables, Raw Data, Function Binding, Function Dependency, Renderer Binding, Project Metadata), projectSqliteRole {authoringStorage: true, runtimeLoopStorage: false}, assertProjectSqliteAccess rejecting the RuntimeLoop accessor via the foundation.authority boundary Runtime Loop -X-> SQLite per-frame query (AuthorityBoundaryError)."
          - "§4 Logical Namespace: LogicalNamespace items (existence space) | logs (time-series space) with isLogicalNamespace; REGISTRY_SCHEMA = 'registry'; no SQLite schema feature (no ATTACH / schema.table): IPhysicalTableNameResolver contract (application tables resolved by the Registry Service in registry.* bundles) and corePhysicalTableNameResolver '<schema>__<table>' with strict identifier validation -> registry__current, logs__savedata."
          - "Storage contract: IProjectSqliteDatabase (exec/run/get/all + transaction with COMMIT on resolve / ROLLBACK on reject, close) and IProjectSqliteDatabaseFactory (Create fails if the file exists, Open fails if missing or not SQLite). node/projectSqliteDatabase.ts implements it on @vscode/sqlite3 (file scheme only, OPEN_CREATE only in Create mode, header check via PRAGMA schema_version, Sequencer-serialized statements, BEGIN IMMEDIATE transactions, closed DB rejects statements)."
          - "Create / Open responsibility boundary (audit fix 89ddeab3): ProjectSqliteStorage supplies the foundation.project-directory IProjectOpenSteps createStorage / openStorage steps, mode-checked against IProjectOpenContext.mode; they only create / open context.paths.sqlite and keep it open for the following steps. No DDL is applied in the Create / Open phase: Editor fixed-schema DDL, including the registry__current / logs__savedata tables, belongs to Editor DDL Scan / Migration Apply (foundation.editor-ddl). The DDL helpers createSaveDataTableDdl / saveDataStorageTables / ensureSaveDataStorage were removed. No earlier producer bundle required an integration fix; projectDirectory.ts / persistenceBoundary.ts / authority.ts are consumed unchanged."
          - "§32 Persistence Boundary Runtime Save Data primitives on the persistenceBoundary contracts: insertSaveEvent / getSaveEvent (logs.savedata = Save Event only), upsertSaveDataCurrentRow (INSERT ... ON CONFLICT(key) DO UPDATE saveId, data; uuid kept; semantics via persistenceBoundary.upsertSaveDataCurrent; saveId -> logs.savedata.uuid checked as a logical reference, no physical foreign key), loadSaveDataCurrent / listSaveDataCurrent. Save sequence, keys, scope and payload remain Application Responsibility; no automatic static data duplication; no autosave / every-frame persistence."
          - "Tests: test/common/projectSqlite.test.ts (8 tests: content order, role + runtime loop rejection, logical namespace / physical names, identifier rejection, Create and Open execute no statements (no DDL), double-open rejection, mode checks, failed open leaves storage closed) and test/node/projectSqliteDatabase.test.ts (7 tests on real @vscode/sqlite3: Open lifecycle Create then Open with no tables created by either phase; tables created by a test-only Editor DDL Scan fixture are left untouched by a later Open and registry.current starts empty; player.hp Save-A -> Save-B UPSERT keeps uuid and persists across reopen, logs.savedata holds only Save Events; UNIQUE key and json_valid CHECK, saveId must name a Save Event; transaction rollback; Create refuses existing file, Open refuses missing / non-SQLite file, non-file scheme rejected; closed DB rejects statements)."
          - "Verification on 89ddeab3: npm run transpile-client, node test/unit/node/index.js --runGlob '**/primitiveAppEditor/test/**/*.test.js' (Node 24.18.0, @vscode/sqlite3 built via node-gyp) -> 49 passing; eslint --max-warnings 0 on src/vs/workbench/contrib/primitiveAppEditor clean; tsc -p src/tsconfig.json --noEmit reports 0 errors in primitiveAppEditor; build/checker/layersChecker.ts passes; build/hygiene.ts on changed files passes. PR #20 CI on 89ddeab3: all checks green except Linux / Electron-Smoke, whose two Dev Container session smoke failures (64 passing, 2 failing) reproduce identically on main d310150b and are unrelated to this bundle."
          - "Out of scope per spec / roadmap: Save Data table DDL and other Editor DDL / schema version / migrations (foundation.editor-ddl), concrete registry.current mutation history tables in logs (not fixed by this spec), Registry Service table resolution (registry.*)."
        remaining: []

      - id: "foundation.editor-ddl"
        title: "Editor built-in DDL and migrations"
        reference:
          - source: "./App Editer.md"
            role: "implementation"
            sections:
              - "§5 Built-in DDL"
        depends_on:
          - "foundation.sqlite"
        status: "implemented"
        evidence:
          - "Implementation commits 38ba7646 + 18733929: src/vs/workbench/contrib/primitiveAppEditor/common/editorDdl.ts encodes §5 Built-in DDL as Editor -> DDL Resource Scan (scanEditorDdlResources: `<NNN>_<name>.sql` names, versions contiguous from 001, non-empty, rejects transaction control (top-level statement keywords BEGIN / COMMIT / END / ROLLBACK / SAVEPOINT / RELEASE, owned by Migration Apply) and ATTACH-DETACH (no SQLite schema feature), SHA-1 checksum per resource) -> Schema Version Compare (compareEditorSchemaVersion / resolveEditorSchemaVersion over the Editor Internal Schema table editor__schema_version {version, name, checksum, appliedAt}; missing table = version 0; rejects a DB migrated by a newer Editor, a modified applied resource, and version gaps) -> Unapplied Migration -> SQLite Transaction -> Apply (applyEditorDdlMigrations: all unapplied migrations plus their version rows in one IProjectSqliteDatabase.transaction, version re-compared inside the transaction, any failure rolls everything back; no-op when current)."
          - "Audit fix 18733929: the Built-in DDL scan no longer restricts DB triggers. 'DB Triggerは使用しない' is the §5 Registry DDL contract owned by registry.service. Because a trigger body's BEGIN / END would otherwise still match the transaction-control rule, that rule now inspects only top-level statement keywords (comments, quoted strings / identifiers and CREATE TRIGGER ... BEGIN ... END bodies skipped)"
          - "common/editorDdlResources.ts holds the `ddl/` built-in resources shipped with the Editor code: 001_savedata.sql creates logs__savedata (Save Event only) and registry__current (UNIQUE key, json_valid CHECK, saveId as logical reference, no physical FK) — the Runtime Save Data DDL that foundation.sqlite deferred to this bundle. Registry DDL (Application Physical Schema) is not part of this pipeline (owned by registry.service)."
          - "Open lifecycle wiring: EditorDdlMigrator supplies the foundation.project-directory IProjectOpenSteps editorDdlScan / schemaVersionResolve / migrationApply steps on the database opened by ProjectSqliteStorage (createStorage / openStorage), enforcing step order."
          - "Producer-consumer integration: test/node/projectSqliteDatabase.test.ts no longer uses the test-only saveDataFixtureDdl stand-in; its Save Data tests now open through the real EditorDdlMigrator + editorDdlResources. No producer source change was required (projectSqlite.ts / projectDirectory.ts / persistenceBoundary.ts consumed unchanged)."
          - "Tests: test/common/editorDdl.test.ts (4 tests: built-in resource scan; name / contiguity / content validation incl. BEGIN-COMMIT, END TRANSACTION, SAVEPOINT-RELEASE, ROLLBACK and ATTACH rejected, a CREATE TEMP TRIGGER resource with BEGIN ... END body accepted, COMMIT after a trigger still rejected; unapplied computation; newer DB / modified resource / gap rejection) and test/node/editorDdl.test.ts (5 tests on real @vscode/sqlite3 via openProjectDirectory: Create applies 001 and reaches Editor Ready, next Open applies none and Save Data persists; a new 002 resource is the only Unapplied Migration on reopen; a failing 002 rolls back 001, 002 and the version table and the open never reaches Editor Ready, a corrected Editor then migrates from 0; newer-DB and modified-resource rejection; step order)."
          - "Verification on 18733929 (Node 24.18.0, @vscode/sqlite3 built via node-gyp): npm run transpile-client + node test/unit/node/index.js --runGlob '**/primitiveAppEditor/test/**/*.test.js' -> 58 passing; eslint --max-warnings 0 on src/vs/workbench/contrib/primitiveAppEditor clean; tsc -p src/tsconfig.json --noEmit reports 0 errors in primitiveAppEditor; build/checker/layersChecker.ts passes; build/hygiene.ts on changed files passes. PR #22 CI on the pre-fix head 3b2835f8 was green on all 13 checks."
        remaining: []

