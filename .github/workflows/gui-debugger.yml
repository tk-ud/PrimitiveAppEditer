name: GUI Debug Tool

on:
  pull_request:
    paths:
      - 'tools/primitive-app-editor/gui-debugger/**'
      - 'docs/primitive-app-editor/roadmap.yaml'
      - '.github/workflows/gui-debugger.yml'

permissions:
  contents: read

jobs:
  tests:
    name: GUI-independent tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --user PyYAML==6.0.3
      - name: Run unit tests
        working-directory: tools/primitive-app-editor/gui-debugger
        run: python3 -m unittest discover -s tests -t . -v
